name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: my-chat-app   # 모든 run 스텝은 my-chat-app 폴더에서 실행

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js App
        run: npm run build

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@latest deploy --only hosting --project chat-f0752 --json
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
